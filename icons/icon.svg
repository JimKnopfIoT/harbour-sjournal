<?xml version="1.0" encoding="UTF-8"?>
<!--
  SJournal app icon — generated by tools/make-logo.py, do not hand-edit.

  MOTIF
  One tapered ink stroke with vector anchor points sitting on it: handwriting
  that is really vector geometry, which is the one thing this app does that no
  other Sailfish sketching app does. Anything finer than the anchors — a dashed
  bezier handle, for instance — turns to dirt at the 86 px launcher size.

  The taper is computed with the same outline maths the app uses to draw and to
  export, so the mark is an honest sample of its own output.

  Sailfish idiom: flat, one accent gradient on a dark tile, no bevels, and the
  system silhouette — three round corners, one sharp.
-->
